anthropic:
  # Only the optional --proofread-api mode uses the API. Commit bodies and
  # explanatory-note sidecars are built without a model (2026-11-02).
  api_key: ''          # or env var ANTHROPIC_API_KEY

logging:
  level: DEBUG
  log_file: scraper.log
  verbose: true

output:
  data_dir: data/rules
  raw_dir: data/rules/raw
  processed_dir: data/rules/processed
  metadata_dir: data/rules/metadata
  preserve_raw_html: true
  json_schema:
    claude_use_structured_only: true
    include_plain_text: true
    include_structured_content: true
    max_section_depth: 4
    single_file_output: true

git:
  enabled: true
  repo_dir: data/rule
  author_name: "ND Courts System"
  author_email: "rules@ndcourts.gov"
  categories:
    ndrappp:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrappp
    ndrct:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrct
    ndsupctadminr:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndsupctadminr
    ndsupctadminorder:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndsupctadminorder
    ndrcivp:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrcivp
    ndrcrimp:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrcrimp
    ndrjuvp:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrjuvp
    ndrev:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrev
    local:
      # Disabled 2026-09-11: district rules live at /local/<district>/<n>, a
      # sub-path the link matcher rejects, so this category yielded 0 links
      # and 1 error every run and pinned the weekly stage at exit 1 (masking
      # real failures). Re-enable once the district-rule naming design lands
      # (ndlaw-mcp PROJECT.md § 2, 'local/<district>/<n> district rules').
      enabled: false
      base_url: https://www.ndcourts.gov/legal-resources/rules/local
    admissiontopracticer:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/admissiontopracticer
    ndrcontinuinglegaled:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrcontinuinglegaled
    ndrprofconduct:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrprofconduct
    ndrlawyerdiscipl:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrlawyerdiscipl
    ndstdsimposinglawyersanctions:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndstdsimposinglawyersanctions
    ndcodejudconduct:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndcodejudconduct
    rjudconductcomm:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/rjudconductcomm
    ndrprocr:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrprocr
    ndrlocalctpr:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/ndrlocalctpr
    rltdpracticeoflawbylawstudents:
      enabled: true
      base_url: https://www.ndcourts.gov/legal-resources/rules/rltdpracticeoflawbylawstudents

proofreading:
  model: claude-sonnet-4-5-20250929
  max_tokens: 2000
  temperature: 0.1
  report_dir: ""                        # Empty = same as repo dir

version_history:
  fetch_historical_versions: true
  max_retries: 3
  request_delay: 1.0
  minutes_cache_dir: data/minutes_cache

rule_categories:
- Appellate Procedure

scraping:
  base_url: https://www.ndcourts.gov/legal-resources/rules
  max_retries: 3
  request_delay: 1.0
  timeout: 30
  user_agent: ND-Court-Rules-Scraper/1.0 (Educational Project)
